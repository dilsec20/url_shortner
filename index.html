<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyLink - Premium URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    <!-- Decorative background elements -->
    <div
        class="absolute top-[-10rem] left-[-10rem] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-50">
    </div>
    <div
        class="absolute bottom-[-10rem] right-[-10rem] w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-50">
    </div>

    <div class="glass p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-lg relative z-10 transition-all">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-3 tracking-tight gradient-text">TinyLink</h1>
            <p class="text-slate-400 text-sm md:text-base">Shorten your long links in seconds.</p>
        </div>

        <form id="shortenForm" class="space-y-6">
            <div>
                <label for="longUrl" class="block text-sm font-medium text-slate-300 mb-2">Long URL (Try a YouTube
                    link!)</label>
                <input type="url" id="longUrl" required placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                    class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white placeholder-slate-500">
            </div>

            <div>
                <label for="customAlias" class="block text-sm font-medium text-slate-300 mb-2">Custom Alias <span
                        class="text-slate-500 text-xs">(Optional)</span></label>
                <div class="flex">
                    <span
                        class="inline-flex items-center px-4 rounded-l-xl border border-r-0 border-slate-700 bg-slate-800 text-slate-400 text-sm">
                        linkia.co/
                    </span>
                    <input type="text" id="customAlias" placeholder="myytvideo"
                        class="flex-1 w-full px-4 py-3 bg-slate-800/50 border border-slate-700 rounded-r-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-white placeholder-slate-500">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-lg transform transition hover:-translate-y-1 focus:ring-4 focus:ring-blue-500/50">
                Shorten Link ✨
            </button>
        </form>

        <!-- Result Box -->
        <div id="resultBox"
            class="mt-8 p-6 rounded-2xl bg-slate-800 border border-slate-700 hidden transform transition-all duration-300 origin-top">
            <div id="successResult" class="hidden text-center space-y-4">
                <p class="text-sm text-green-400 font-semibold mb-1">Successfully Shortened!</p>
                <a id="shortUrlDisplay" href="#" target="_blank"
                    class="block text-2xl font-bold text-white hover:text-blue-400 transition-colors break-all"></a>
                <div class="flex justify-center gap-3 mt-4">
                    <button id="copyBtn"
                        class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors">
                        Copy to Clipboard
                    </button>
                    <a id="analyticsBtn" href="#" target="_blank"
                        class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors text-slate-300">
                        View Analytics
                    </a>
                </div>
            </div>

            <div id="errorResult" class="hidden text-center">
                <p class="text-red-400 font-medium break-words" id="errorMessage">An error occurred.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('shortenForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const longUrl = document.getElementById('longUrl').value;
            const customAlias = document.getElementById('customAlias').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const successResult = document.getElementById('successResult');
            const errorResult = document.getElementById('errorResult');
            const shortUrlDisplay = document.getElementById('shortUrlDisplay');
            const errorMessage = document.getElementById('errorMessage');
            const analyticsBtn = document.getElementById('analyticsBtn');

            // Set loading state
            submitBtn.innerHTML = 'Shortening... <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            submitBtn.disabled = true;

            resultBox.classList.add('hidden');
            successResult.classList.add('hidden');
            errorResult.classList.add('hidden');

            const payload = { long_url: longUrl };
            if (customAlias.trim() !== '') {
                payload.custom_alias = customAlias.trim();
            }

            try {
                // Dynamically use the current domain (e.g., your Render domain or localhost)
                const API_BASE = window.location.origin;
                const response = await fetch(`${API_BASE}/shorten`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                resultBox.classList.remove('hidden');

                if (response.ok) {
                    successResult.classList.remove('hidden');

                    const parts = data.short_url.split('/');
                    const alias = parts[parts.length - 1];
                    const localUrl = `${API_BASE}/` + alias;

                    // Display string vs actual href link
                    const displayUrl = `https://link069.in/` + alias;

                    shortUrlDisplay.href = localUrl;
                    shortUrlDisplay.textContent = displayUrl;
                    analyticsBtn.href = `${API_BASE}/analytics/` + alias;
                } else {
                    errorResult.classList.remove('hidden');
                    // Data might be just a string if it's an error from crow
                    errorMessage.textContent = data || "Failed to shorten URL. Try a different alias.";
                }
            } catch (err) {
                resultBox.classList.remove('hidden');
                errorResult.classList.remove('hidden');
                errorMessage.textContent = 'Network error. Is the server running?';
            } finally {
                submitBtn.innerHTML = 'Shorten Link ✨';
                submitBtn.disabled = false;
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const shortUrl = document.getElementById('shortUrlDisplay').textContent;
            navigator.clipboard.writeText(shortUrl);
            const originalText = document.getElementById('copyBtn').textContent;
            document.getElementById('copyBtn').textContent = 'Copied!';
            setTimeout(() => {
                document.getElementById('copyBtn').textContent = 'Copy to Clipboard';
            }, 2000);
        });
    </script>
</body>

</html>
